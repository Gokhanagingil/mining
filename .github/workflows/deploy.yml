name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_health_check:
        description: 'Skip health checks (emergency deploy)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME || 'mining' }}

jobs:
  # ─── Gate: Ensure CI checks would pass ────────────────────────────────────
  # On push events, CI workflow runs in parallel. This job runs a quick
  # validation to avoid deploying obviously broken code.
  # For a stronger gate, configure the `production` environment with
  # required status checks or branch protection rules on `main`.
  pre-deploy-validation:
    name: Pre-Deploy Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose config
        working-directory: infra
        run: |
          docker compose config --quiet
          echo "✓ Docker Compose configuration is valid"

      - name: Validate deploy scripts exist and are valid
        run: |
          for script in scripts/deploy-remote.sh scripts/health-check.sh scripts/rollback-remote.sh; do
            if [ ! -f "$script" ]; then
              echo "✗ Missing: $script"
              exit 1
            fi
            bash -n "$script"
            echo "✓ Valid: $script"
          done

  # ─── Deploy ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: [pre-deploy-validation]
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
            echo "✓ Using provided known_hosts"
          else
            ssh-keyscan -p ${{ secrets.DEPLOY_PORT || 22 }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
            echo "⚠ Auto-scanned host key (consider setting DEPLOY_KNOWN_HOSTS for security)"
          fi

      - name: Deploy application
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_ENV_CONTENT: ${{ secrets.APP_ENV_FILE }}
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "Deploying to ${SSH_HOST}:${DEPLOY_PATH}"
          echo "Commit: ${{ github.sha }}"
          echo "Ref: ${{ github.ref }}"
          echo "═══════════════════════════════════════════════════════════"

          # Base64 encode the env content for safe transport
          if [ -n "${APP_ENV_CONTENT}" ]; then
            ENV_B64=$(echo "${APP_ENV_CONTENT}" | base64 -w 0)
          else
            ENV_B64=""
          fi

          ssh -i ~/.ssh/deploy_key \
              -p "${SSH_PORT}" \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=30 \
              "${SSH_USER}@${SSH_HOST}" \
              "DEPLOY_PATH='${DEPLOY_PATH}' \
               REPO_URL='https://github.com/${{ github.repository }}.git' \
               APP_ENV_CONTENT='${ENV_B64}' \
               GIT_REF='main' \
               COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT_NAME}' \
               bash -s" < scripts/deploy-remote.sh

      - name: Health check
        if: ${{ github.event.inputs.skip_health_check != 'true' }}
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "Running post-deploy health checks..."

          ssh -i ~/.ssh/deploy_key \
              -p "${SSH_PORT}" \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=30 \
              "${SSH_USER}@${SSH_HOST}" \
              "DEPLOY_PATH='${DEPLOY_PATH}' \
               HEALTH_CHECK_RETRIES=12 \
               HEALTH_CHECK_INTERVAL=5 \
               bash -s" < scripts/health-check.sh

      - name: Rollback on failure
        if: failure() && steps.deploy.outcome == 'success'
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "HEALTH CHECK FAILED — initiating rollback"
          echo "═══════════════════════════════════════════════════════════"

          ssh -i ~/.ssh/deploy_key \
              -p "${SSH_PORT}" \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=30 \
              "${SSH_USER}@${SSH_HOST}" \
              "DEPLOY_PATH='${DEPLOY_PATH}' \
               COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT_NAME}' \
               bash -s" < scripts/rollback-remote.sh

          echo ""
          echo "Rollback complete. Running health check on rolled-back version..."

          ssh -i ~/.ssh/deploy_key \
              -p "${SSH_PORT}" \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=30 \
              "${SSH_USER}@${SSH_HOST}" \
              "DEPLOY_PATH='${DEPLOY_PATH}' \
               HEALTH_CHECK_RETRIES=12 \
               HEALTH_CHECK_INTERVAL=5 \
               bash -s" < scripts/health-check.sh || {
            echo "═══════════════════════════════════════════════════════════"
            echo "CRITICAL: Rollback health check also failed!"
            echo "Manual intervention required on ${SSH_HOST}:${DEPLOY_PATH}"
            echo "═══════════════════════════════════════════════════════════"
            exit 1
          }

          echo "Rollback health check passed. Service restored to previous version."
          echo "The deploy workflow will still be marked as failed."
          exit 1

      - name: Deploy summary
        if: success()
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "  ✓ DEPLOYMENT SUCCESSFUL"
          echo "═══════════════════════════════════════════════════════════"
          echo "  Commit:      ${{ github.sha }}"
          echo "  Branch:      ${{ github.ref_name }}"
          echo "  Triggered:   ${{ github.event_name }}"
          echo "  Actor:       ${{ github.actor }}"
          echo "  Timestamp:   $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "═══════════════════════════════════════════════════════════"
